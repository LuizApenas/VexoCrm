# docker-compose.full-stack.yml
# Infraestrutura Unificada para VPS - Vexo CRM & Sales Module
# Executar na VPS: docker compose -f ops/docker-compose.full-stack.yml up -d

version: '3.8'

services:
  # 1. Banco de Dados PostgreSQL Principal
  postgres:
    image: postgres:16-alpine
    container_name: vexo-postgres
    restart: always
    environment:
      POSTGRES_DB: vexo_db
      POSTGRES_USER: vexo_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-TroqueEstaSenhaForte123!}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vexo_admin -d vexo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Cache & Filas Redis (BullMQ / Follow-up)
  redis:
    image: redis:7-alpine
    container_name: vexo-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-TroqueEstaSenhaRedis123!} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-TroqueEstaSenhaRedis123!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Evolution API v2 (WhatsApp Messaging Engine)
  evolution-api:
    image: atendai/evolution-api:v2.1.1
    container_name: vexo-evolution-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=${EVOLUTION_SERVER_URL:-https://evolution.seudominio.com.br}
      - API_KEY=${EVOLUTION_API_KEY:-sua_api_key_evolution_secret}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgres://vexo_admin:${DB_PASSWORD:-TroqueEstaSenhaForte123!}@postgres:5432/evolution_db
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://:${REDIS_PASSWORD:-TroqueEstaSenhaRedis123!}@redis:6379/1
    volumes:
      - evolution_instances:/evolution/instances

  # 4. Vexo Backend Node.js API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: vexo-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    env_file:
      - ../backend/.env
    environment:
      PORT: "3001"
      NODE_ENV: production
      DB_DRIVER: postgres
      DATABASE_URL: postgres://vexo_admin:${DB_PASSWORD:-TroqueEstaSenhaForte123!}@postgres:5432/vexo_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-TroqueEstaSenhaRedis123!}@redis:6379/0
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-sua_api_key_evolution_secret}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health/live"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # 5. Monitoramento de Uptime Kuma (Opcional - Observabilidade)
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: vexo-uptime-kuma
    restart: always
    ports:
      - "3002:3001"
    volumes:
      - uptime_data:/app/data

volumes:
  pgdata:
  redisdata:
  evolution_instances:
  uptime_data:
