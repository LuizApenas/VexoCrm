<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vexo Scout — Configurações</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 24, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #a855f7;
      --success: #10b981;
      --danger: #ef4444;
      --input-bg: #0f172a;
      --input-border: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 350px;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
    }

    .title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 12px;
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      margin-bottom: 14px;
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .status-dot.connected {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .status-dot.disconnected {
      background: var(--danger);
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 8px 10px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    button {
      flex: 1;
      padding: 9px 12px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
    }

    .btn-primary:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--card-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .message {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      display: none;
      animation: fadeIn 0.2s ease;
    }

    .message.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .message.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .footer {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid var(--card-border);
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .footer-step {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin-top: 4px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo-icon">⚡</div>
      <div class="title">Vexo Scout</div>
    </div>
    <span class="badge">v1.0.0</span>
  </div>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Verificando conexão...</span>
  </div>

  <div class="auto-connect-section" style="margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1);">
    <button type="button" id="btnAutoSync" class="btn-primary" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; background: linear-gradient(135deg, #6366F1, #8B5CF6); border: none; padding: 10px; border-radius: 10px; cursor: pointer; color: white;">
      ⚡ Conectar com Vexo OS Aberto
    </button>
    <p style="font-size: 10px; color: #94a3b8; text-align: center; margin-top: 6px;">
      Mantenha a aba do Vexo OS aberta para conectar em 1 clique
    </p>
  </div>

  <form id="configForm">
    <div class="form-group">
      <label for="apiUrl">URL da API do CRM</label>
      <input type="url" id="apiUrl" placeholder="https://crm.vexoia.com" required>
    </div>

    <div class="form-group">
      <label for="clientId">ID da Empresa / Tenant</label>
      <input type="text" id="clientId" placeholder="ex: geracao-digital" required>
    </div>

    <div class="form-group">
      <label for="authToken">Token de Autenticação (Bearer)</label>
      <input type="password" id="authToken" placeholder="Cole seu token do Vexo OS" required>
    </div>

    <div class="btn-group">
      <button type="button" id="btnTest" class="btn-secondary">
        🔄 Testar
      </button>
      <button type="submit" id="btnSave" class="btn-primary">
        💾 Salvar
      </button>
    </div>
  </form>

  <div class="message" id="messageBox"></div>

  <div class="footer">
    <div style="font-weight: 600; margin-bottom: 2px;">Como Usar no Instagram & LinkedIn:</div>
    <div class="footer-step"><span>1.</span> Abra uma conversa no Direct ou LinkedIn.</div>
    <div class="footer-step"><span>2.</span> Clique no botão flutuante <strong>⚡ Minerar com Vexo OS</strong>.</div>
    <div class="footer-step"><span>3.</span> O lead é salvo direto no seu Banco de Dados!</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
